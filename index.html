<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Ocean Independence | Charter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main>

    <section class="scene">
      <video class="scene-video" autoplay muted loop playsinline preload="auto"
             src="clips/clip-1.mp4" poster="clips/clip-1.jpg"></video>
      <div class="scene-copy"><h2>Where the horizon begins</h2></div>
    </section>

    <section class="scene">
      <video class="scene-video" autoplay muted loop playsinline preload="auto"
             src="clips/clip-2.mp4" poster="clips/clip-2.jpg"></video>
      <div class="scene-copy"><h2>Your world, unhurried</h2></div>
    </section>

    <section class="scene">
      <video class="scene-video" muted loop playsinline preload="none"
             data-src="clips/clip-3.mp4" poster="clips/clip-3.jpg"></video>
      <div class="scene-copy"><h2>Anchored in the extraordinary</h2></div>
    </section>

    <section class="scene">
      <video class="scene-video" muted loop playsinline preload="none"
             data-src="clips/clip-4.mp4" poster="clips/clip-4.jpg"></video>
      <div class="scene-copy"><h2>Chart a course entirely your own</h2></div>
    </section>

    <section class="scene">
      <video class="scene-video" muted loop playsinline preload="none"
             data-src="clips/clip-5.mp4" poster="clips/clip-5.jpg"></video>
      <div class="scene-copy"><h2>Evenings that drift with the tide</h2></div>
    </section>

    <section class="scene">
      <video class="scene-video" muted loop playsinline preload="none"
             data-src="clips/clip-6.mp4" poster="clips/clip-6.jpg"></video>
      <div class="scene-copy"><h2>The sea, on your terms</h2></div>
    </section>

    <section class="finale">
      <h1>Ocean Independence</h1>
      <p>Over 100 yachts for charter</p>
      <a class="button" href="#">Begin your journey</a>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="main.js"></script>
</body>
</html>
